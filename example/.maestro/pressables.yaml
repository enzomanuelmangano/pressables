# Walks every example screen in ONE session: launch once (one ennio inject),
# navigate in → assert → `back` to home → next. Avoids per-flow relaunch
# (clearState breaks Android's agent re-inject) and keeps the run fast.
appId: reactiive.pressables.example
---
- launchApp
# --- Home: every nav entry renders ---
- assertVisible: 'Rotation Example'
- assertVisible: 'Toggle Options'
- assertVisible: 'Theme Metadata'
- assertVisible: 'Global Handlers + Metadata'

# --- Options: pressto per-press toggle (isToggled) ---
- tapOn:
    id: 'nav-options'
- assertVisible: 'Pressable Options Demo'
- assertVisible: 'btn1 toggled=false'
- tapOn:
    id: 'options-button-1'
- assertVisible: 'btn1 toggled=true'
- tapOn:
    id: 'options-button-1'
- assertVisible: 'btn1 toggled=false'
- assertVisible: 'btn2 toggled=true'   # initialToggled
- tapOn:
    id: 'options-button-3'
- assertVisible: 'btn3 toggled=true'
- back

# --- Rotation: 1000-item pressable list renders + scrolls ---
- assertVisible: 'Rotation Example'
- tapOn:
    id: 'nav-rotation'
- assertVisible:
    id: 'rotation-list'
- swipe:
    direction: UP
- swipe:
    direction: UP
- assertVisible:
    id: 'rotation-list'
- back

# --- Metadata: themed pressables respond + survive ---
- assertVisible: 'Theme Metadata'
- tapOn:
    id: 'nav-metadata'
- assertVisible: 'Metadata Theme Example'
- tapOn: 'Primary Button'
- tapOn: 'Secondary (Toggle)'
- assertVisible: 'Metadata Theme Example'
- back

# --- Global handlers: pressables fire + survive ---
- assertVisible: 'Global Handlers + Metadata'
- tapOn:
    id: 'nav-global'
- assertVisible: 'Checkout'
- tapOn: 'Checkout'
- tapOn: 'Cancel'
- assertVisible: 'Checkout'
- back

- assertVisible: 'Rotation Example'   # back at home
