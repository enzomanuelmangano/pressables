# pressto per-press toggle + single-selection (isToggled / isSelected).
# Each button mirrors its pressto options into a status label we assert.
appId: reactiive.pressables.example
---
- launchApp
- tapOn: 'Toggle Options'
- assertVisible: 'Pressable Options Demo'
# Button 1 starts un-toggled; a press flips it, another press flips it back.
- assertVisible: 'btn1 toggled=false'
- tapOn:
    id: 'options-button-1'
- assertVisible: 'btn1 toggled=true'
- tapOn:
    id: 'options-button-1'
- assertVisible: 'btn1 toggled=false'
# Button 2 starts toggled (initialToggled).
- assertVisible: 'btn2 toggled=true'
# isSelected: pressing Button 3 makes it the selected pressable.
- tapOn:
    id: 'options-button-3'
- assertVisible: 'btn3 selected=true'
