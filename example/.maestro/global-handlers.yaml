# Global-handlers screen: renders, pressables fire + survive.
appId: reactiive.pressables.example
---
- launchApp:
    clearState: true
- assertVisible: 'Global Handlers + Metadata'
- tapOn:
    id: 'nav-global'
- assertVisible: 'Checkout'
- tapOn: 'Checkout'
- tapOn: 'Cancel'
- assertVisible: 'Checkout'
