# 1000-item list of rotation pressables: renders, scrolls, survives.
appId: reactiive.pressables.example
---
- launchApp:
    clearState: true
- assertVisible: 'Rotation Example'
- tapOn:
    id: 'nav-rotation'
- assertVisible:
    id: 'rotation-list'
- swipe:
    direction: UP
- swipe:
    direction: UP
- assertVisible:
    id: 'rotation-list'
